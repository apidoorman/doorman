name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway-rs
      - name: Check formatting
        run: cargo fmt --manifest-path gateway-rs/Cargo.toml --all -- --check
      - name: Verify pinned Python parity reference
        run: |
          git branch --force python-parity-reference 10699820f50abe3940134536a98c955deab6959f
          python3 scripts/check_parity_reference.py
      - name: Run Clippy
        run: cargo clippy --manifest-path gateway-rs/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --manifest-path gateway-rs/Cargo.toml --locked

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-client/package-lock.json
      - name: Install dependencies
        working-directory: web-client
        run: npm ci
      - name: Build web client
        working-directory: web-client
        env:
          NEXT_PUBLIC_GATEWAY_URL: http://localhost:3001
        run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Rust-only image
        run: docker build --tag doorman:ci .
