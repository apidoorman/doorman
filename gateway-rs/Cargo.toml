[package]
name = "doorman-gateway"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "doorman_gateway"
path = "src/lib.rs"

[[bin]]
name = "doorman-gateway"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["http2", "macros"] }
bytes = "1.10"
futures-util = "0.3"
http = "1.3"
http-body-util = "0.1"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "http2", "stream", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.8", features = ["catch-panic", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0"
