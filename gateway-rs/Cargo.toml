[package]
name = "doorman-gateway"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "doorman_gateway"
path = "src/lib.rs"

[[bin]]
name = "doorman-gateway"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["http2", "macros"] }
base64 = "0.22"
bytes = "1.10"
futures-util = "0.3"
http = "1.3"
http-body-util = "0.1"
jsonwebtoken = "9"
mongodb = "3"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
quick-xml = "0.38"
redis = { version = "0.32", features = ["aio", "tokio-comp", "connection-manager"] }
regex = "1"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "http2", "stream", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.48", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.8", features = ["catch-panic", "compression-gzip", "trace"] }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
flate2 = "1.1"
prost-types = "0.14"
serde_json = "1.0"
